
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Métricas | NapoNet</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: #f3f6fb;
      color: #172033;
    }

    main {
      max-width: 1100px;
      margin: auto;
    }

    h1 { color: #123b70; }

    .panel, .card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 2px 10px #0000000b;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 16px;
    }

    .number {
      font-size: 30px;
      font-weight: bold;
      margin-top: 12px;
    }

    input, button {
      padding: 12px;
      margin: 5px 0;
      border-radius: 7px;
      border: 1px solid #ccd4e0;
    }

    input { width: min(90%, 340px); }

    button {
      background: #1459a6;
      color: white;
      border: 0;
      cursor: pointer;
    }

    .chart {
      height: 300px;
    }

    .hidden { display: none; }
    #estado { white-space: pre-wrap; }
    li { margin: 10px 0; }
  </style>
</head>

<body>
<main>
  <h1>NapoNet | Panel de métricas</h1>
  <p>Estadísticas de la Encuesta Plan Conecta</p>

  <section id="login" class="panel">
    <p id="estadoLogin" role="status" aria-live="polite"></p>
    <h2>Acceso de administrador</h2>
    <form id="formLogin">
      <input id="correo" type="email"
        placeholder="Correo administrador" required>
      <br>
      <input id="clave" type="password"
        placeholder="Contraseña" required>
      <br>
      <button type="submit">Iniciar sesión</button>
    </form>
  </section>

  <section id="dashboard" class="hidden">
    <div class="panel">
      <button id="actualizar">Actualizar métricas</button>
      <button id="salir">Cerrar sesión</button>
      <p id="estado" role="status">Cargando...</p>
    </div>

    <div class="grid">
      <article class="card">
        Total de encuestas
        <div id="total" class="number">—</div>
      </article>

      <article class="card">
        Satisfacción promedio
        <div id="satisfaccion" class="number">—</div>
      </article>

      <article class="card">
        Recomendación promedio
        <div id="recomendacion" class="number">—</div>
      </article>

      <article class="card">
        Calidad promedio
        <div id="calidad" class="number">—</div>
      </article>
    </div>

    <div class="grid">
      <article class="panel">
        <h2>Satisfacción</h2>
        <div class="chart"><canvas id="grafSatisfaccion"></canvas></div>
      </article>

      <article class="panel">
        <h2>Calidad del servicio</h2>
        <div class="chart"><canvas id="grafCalidad"></canvas></div>
      </article>

      <article class="panel">
        <h2>Motivos seleccionados</h2>
        <div class="chart"><canvas id="grafMotivos"></canvas></div>
      </article>
    </div>

    <section class="panel">
      <h2>Comentarios recibidos</h2>
      <ul id="comentarios"></ul>
    </section>
  </section>
</main>

<script>
  // Reemplaza estos valores por los de TU proyecto.
const SUPABASE_URL = "https://zlwjpwmsebwxbyvwiyfu.supabase.co/rest/v1/";  
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inpsd2pwd21zZWJ3eGJ5dndpeWZ1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4MjUyMTAsImV4cCI6MjEwNzQwMTIxMH0.tPWOes-3tf1cgmDH2Dc3ED2tPsfySELuVIx3CHHSByg";

  const db = window.supabase.createClient(
    SUPABASE_URL, SUPABASE_KEY
  );

  const $ = id => document.getElementById(id);
  let graficos = {};
   
$("formLogin").addEventListener("submit", async e => {
  e.preventDefault();

  const estado = $("estadoLogin");
  const boton = $("formLogin").querySelector('button[type="submit"]');

  estado.textContent = "Comprobando credenciales...";
  boton.disabled = true;

  try {
    const { data, error } = await db.auth.signInWithPassword({
      email: $("correo").value.trim(),
      password: $("clave").value
    });

    if (error) {
      estado.textContent = "Error de acceso: " + error.message;
      console.error("Error de Supabase:", error);
      return;
    }

    if (!data.session) {
      estado.textContent = "No se recibió una sesión válida.";
      return;
    }

    $("login").classList.add("hidden");
    $("dashboard").classList.remove("hidden");

    await cargarMetricas();

  } catch (err) {
    estado.textContent = "Error inesperado: " + err.message;
    console.error(err);
  } finally {
    boton.disabled = false;
  }
});


    $("login").classList.add("hidden");
    $("dashboard").classList.remove("hidden");
    await cargarMetricas();
  });

  $("actualizar").addEventListener("click", cargarMetricas);

  $("salir").addEventListener("click", async () => {
    await db.auth.signOut();
    $("dashboard").classList.add("hidden");
    $("login").classList.remove("hidden");
  });

  function valorNumero(valor) {
    if (typeof valor === "number") return valor;

    const match = String(valor ?? "").match(/-?\d+(?:[.,]\d+)?/);
    return match ? Number(match[0].replace(",", ".")) : null;
  }

  function texto(valor) {
    return String(valor ?? "")
      .replace(/\s*[✅☑️✔️]+\s*/g, " ")
      .trim();
  }

  function resumenNumero(respuestas, campo) {
    const valores = respuestas
      .map(r => valorNumero(r[campo]))
      .filter(n => n !== null && Number.isFinite(n));

    return {
      promedio: valores.length
        ? valores.reduce((a, b) => a + b, 0) / valores.length
        : null,
      valores
    };
  }

  function contar(respuestas, campo) {
    const conteo = {};

    respuestas.forEach(r => {
      const v = texto(r[campo]);
      if (v) conteo[v] = (conteo[v] || 0) + 1;
    });

    return conteo;
  }

  function dibujar(id, tipo, datos) {
    if (graficos[id]) graficos[id].destroy();

    graficos[id] = new Chart($(id), {
      type: tipo,
      data: {
        labels: Object.keys(datos),
        datasets: [{
          label: "Respuestas",
          data: Object.values(datos)
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false
      }
    });
  }

  async function cargarMetricas() {
    $("estado").textContent = "Consultando Supabase...";

    const { data: sesionData } = await db.auth.getSession();

    if (!sesionData.session) {
      $("dashboard").classList.add("hidden");
      $("login").classList.remove("hidden");
      $("estado").textContent = "Inicia sesión para continuar.";
      return;
    }

    // Traer todas las filas por páginas para no limitar
    // el panel a las primeras 1000 respuestas.
    let filas = [];
    const tamanoPagina = 500;

    for (let desde = 0; ; desde += tamanoPagina) {
      const { data, error } = await db
        .from("encuestas_conecta")
        .select("id, fecha, respuestas")
        .order("fecha", { ascending: false })
        .range(desde, desde + tamanoPagina - 1);

      if (error) {
        $("estado").textContent =
          "Error consultando datos: " + error.message;
        return;
      }

      filas = filas.concat(data || []);
      if (!data || data.length < tamanoPagina) break;
    }

    const respuestas = filas.map(f => f.respuestas || {});
    const sat = resumenNumero(respuestas, "satisfaction");
    const rec = resumenNumero(respuestas, "recommend");
    const cal = resumenNumero(respuestas, "quality");

    $("total").textContent = filas.length;
    $("satisfaccion").textContent =
      sat.promedio === null ? "Sin datos" :
      sat.promedio.toFixed(2) + " / 5";
    $("recomendacion").textContent =
      rec.promedio === null ? "Sin datos" :
      rec.promedio.toFixed(2) + " / 10";
    $("calidad").textContent =
      cal.promedio === null ? "Sin datos" :
      cal.promedio.toFixed(2) + " / 5";

    dibujar("grafSatisfaccion", "bar", contar(respuestas, "satisfaction"));
    dibujar("grafCalidad", "bar", contar(respuestas, "quality"));
    dibujar("grafMotivos", "doughnut", contar(respuestas, "reason"));

    const lista = $("comentarios");
    lista.replaceChildren();

    filas.forEach(f => {
      const comentario = texto(f.respuestas?.comment);
      if (!comentario) return;

      const li = document.createElement("li");
      li.textContent =
        `${f.fecha ? new Date(f.fecha).toLocaleString("es-CL") : ""} — ${comentario}`;
      lista.appendChild(li);
    });

    $("estado").textContent =
      "Datos actualizados: " + new Date().toLocaleString("es-CL");
  }

  // Si ya existe una sesión válida, mostrar el panel.
  db.auth.getSession().then(({ data }) => {
    if (data.session) {
      $("login").classList.add("hidden");
      $("dashboard").classList.remove("hidden");
      cargarMetricas();
    }
  });
</script>
</body>
</html>
